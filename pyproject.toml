[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficdynshift"
version = "0.1.0"
description = "Cross-network traffic forecasting from network morphology to propagation dynamics under distribution shift."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jinghao Hu" }]
dependencies = [
  "hydra-core>=1.3,<2",
  "numpy>=1.24",
  "omegaconf>=2.3,<3",
  "pandas>=2.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
