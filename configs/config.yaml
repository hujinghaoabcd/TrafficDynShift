defaults:
  - data: pems
  - model: pdr
  - training: default
  - experiment: zero_shot
  - runtime: default
  - _self_

project:
  name: TrafficDynShift
  paper_title: "From Network Morphology to Propagation Dynamics: Cross-Network Traffic Forecasting under Distribution Shift"

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${experiment.name}_${experiment.target_region}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
